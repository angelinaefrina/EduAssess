services:
  # ==========================================
  # NODE 1: BACKEND INSTANCE A
  # ==========================================
  backend-node-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arahin-backend-node-1
    env_file:
      - path: ./backend/.env
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ID=node-1
      - PORT=4000
      - CORS_ORIGIN=http://localhost:3000,http://localhost
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - arahin-network

  # ==========================================
  # NODE 2: BACKEND INSTANCE B
  # ==========================================
  backend-node-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arahin-backend-node-2
    env_file:
      - path: ./backend/.env
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ID=node-2
      - PORT=4000
      - CORS_ORIGIN=http://localhost:3000,http://localhost
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - arahin-network

  # ==========================================
  # FRONTEND WEB APPLICATION (NEXT.JS)
  # ==========================================
  frontend:
    build:
      context: ./frontend/webapp
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://oglixsgljlemprjmpnmj.supabase.co}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-sb_publishable_wG6J-TF4bFuQRHL0oFXsww_Zddq_XC5}
    container_name: arahin-frontend
    env_file:
      - path: ./frontend/webapp/.env
        required: false
      - path: ./frontend/webapp/.env.local
        required: false
      - path: .env
        required: false
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - INTERNAL_API_URL=http://load-balancer/api/v1
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - arahin-network

  # ==========================================
  # REVERSE PROXY & LOAD BALANCER (NGINX)
  # ==========================================
  load-balancer:
    image: nginx:alpine
    container_name: arahin-load-balancer
    ports:
      - "80:80"     # Port HTTP standar (Gateway frontend & API load balancer)
      - "4000:4000" # Port 4000 langsung ke cluster API backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-node-1
      - backend-node-2
      - frontend
    restart: unless-stopped
    networks:
      - arahin-network

networks:
  arahin-network:
    driver: bridge
