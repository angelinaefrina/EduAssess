user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Format log dengan informasi upstream server untuk analisa load test
    log_format loadtest '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" '
                        'upstream: $upstream_addr '
                        'response_time: ${upstream_response_time}s '
                        'status: $upstream_status';

    access_log /var/log/nginx/access.log loadtest;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression untuk efisiensi bandwidth
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ==========================================
    # CLUSTER BACKEND (2 NODE HIGH AVAILABILITY)
    # ==========================================
    upstream backend_nodes {
        # Algoritma pembagian beban: least_conn
        # Mengarahkan request ke node yang saat itu memiliki beban / koneksi paling rendah
        least_conn;

        # Node 1 & Node 2
        # max_fails=3 fail_timeout=10s: jika 3 kali gagal berturut-turut, node ditandai down selama 10 detik
        server backend-node-1:4000 max_fails=3 fail_timeout=10s;
        server backend-node-2:4000 max_fails=3 fail_timeout=10s;

        # Keepalive connections ke upstream servers untuk efisiensi
        keepalive 64;
    }

    # ==========================================
    # UPSTREAM FRONTEND (NEXT.JS APP)
    # ==========================================
    upstream frontend_nodes {
        server frontend:3000;
        keepalive 32;
    }

    # ==========================================
    # MAIN GATEWAY (PORT 80)
    # - / -> Frontend Web Application
    # - /api/ -> Backend Cluster (Load Balanced)
    # ==========================================
    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # Timeout settings dioptimasi untuk pengetesan beban (load test)
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Endpoint metrik Nginx langsung (koneksi aktif, total req) untuk monitoring load test
        location /stub_status {
            stub_status;
            access_log off;
        }

        # Healthcheck endpoint Load Balancer
        location /lb-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","service":"arahin-load-balancer","strategy":"least_conn","nodes":["backend-node-1:4000","backend-node-2:4000"]}\n';
        }

        # Teruskan request API ke upstream backend cluster
        location /api/ {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Header bukti load balancing & performa (bisa diperiksa di curl / inspect network / k6)
            add_header X-Served-By $upstream_addr always;
            add_header X-Upstream-Status $upstream_status always;
            add_header X-Upstream-Response-Time $upstream_response_time always;

            # ==========================================
            # HIGH AVAILABILITY & AUTOMATIC FAILOVER
            # ==========================================
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }

        # Teruskan seluruh request halaman ke Frontend Next.js
        location / {
            proxy_pass http://frontend_nodes;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
        }
    }

    # ==========================================
    # DEDICATED BACKEND PORT (4000)
    # Kompatibel langsung dengan frontend dev & konfigurasi NEXT_PUBLIC_API_URL
    # ==========================================
    server {
        listen 4000;
        server_name localhost;

        client_max_body_size 10M;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        location / {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Served-By $upstream_addr always;
            add_header X-Upstream-Status $upstream_status always;
            add_header X-Upstream-Response-Time $upstream_response_time always;

            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }
    }
}
